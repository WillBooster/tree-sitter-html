[package]
authors = ["WillBooster Inc."]
autoexamples = false
categories = ["parser-implementations", "parsing", "text-editors"]
description = "HTML grammar for tree-sitter"
edition = "2024"
keywords = ["incremental", "parsing", "tree-sitter", "html"]
license = "MIT"
name = "willbooster-tree-sitter-html"
readme = "README.md"
repository = "https://github.com/WillBooster/tree-sitter-html"
version = "0.0.0"

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "/grammar.js",
  "queries/*.scm",
  "src/*.c",
  "src/*.h",
  "src/*.json",
  "src/tree_sitter/*",
  "/tree-sitter.json",
  "/LICENSE",
]

[lib]
name = "tree_sitter_html"
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = { package = "willbooster-tree-sitter", version = "15.0.0" }
